services:
  crypto-agent:
    build:
      context: .
      dockerfile: Dockerfile
    image: crypto-agent:latest
    container_name: crypto-agent
    restart: unless-stopped
    user: "${CRYPTO_AGENT_UID:-1000}:${CRYPTO_AGENT_GID:-1000}"
    env_file:
      - .env
    environment:
      CRYPTO_AGENT_ENV: production
      HOME: /data
      MEMORY_DB_PATH: /data/crypto_agent.db
      CRYPTO_AGENT_SOCK: /run/crypto-agent/crypto-agent.sock
    volumes:
      - ./data:/data
      - ./runtime:/run/crypto-agent
    command:
      - crypto-agent-py
      - daemon
      - --database-path
      - /data/crypto_agent.db
      - --socket-path
      - /run/crypto-agent/crypto-agent.sock
      - --environment
      - production
      - --init-db
    healthcheck:
      test:
        [
          "CMD",
          "crypto-agent-py-client",
          "--socket-path",
          "/run/crypto-agent/crypto-agent.sock",
          "health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
