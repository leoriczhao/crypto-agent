[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-agent"
version = "0.1.0"
description = "Python core rewrite for the crypto trading agent"
requires-python = ">=3.12"
dependencies = [
  "ccxt>=4.0",
  "langgraph>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4",
]
agent = [
  "langchain>=1.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
]
trading = []

[project.scripts]
crypto-agent-py = "crypto_agent.main:console_main"
crypto-agent-py-client = "crypto_agent.cli.main:console_main"

[tool.setuptools.packages.find]
include = ["crypto_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
pythonpath = ["."]
